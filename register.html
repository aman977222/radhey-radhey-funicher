<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Register — Radhey Radhey Furniture & Handicraft</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Google Firebase Cloud SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <style>
    .auth-wrapper {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      background: white;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 480px;
      padding: 35px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-light);
      border-top: 4px solid var(--primary-red);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: gray;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
      background: white;
      font-family: inherit;
      box-sizing: border-box;
    }
    .form-group input:focus, .form-group textarea:focus {
      background: white;
      border-color: var(--primary-red);
      outline: none;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon">RR</div>
        <div class="logo-text">
          <h1>RADHEY <span>RADHEY</span></h1>
          <p>Furniture & Handicraft</p>
          <span class="logo-subtitle">(All Types of Glass, Aluminium &amp; Steel Work)</span>
        </div>
      </a>
      <a href="index.html" style="color: white; font-size: 0.88rem; margin-left: auto;">← Back to Home</a>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 25px;">
        <h2 style="font-family: var(--font-serif); font-size: 1.8rem; font-weight: 800; color: black;">Create Customer Account</h2>
        <p style="color: gray; font-size: 0.9rem;">Join thousands of families enjoying royal wooden craft</p>
      </div>

      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="regName" placeholder="e.g. Anand Rathi" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label>Mobile (WhatsApp) *</label>
            <input type="tel" id="regPhone" placeholder="10-digit mobile" required pattern="[0-9]{10}">
          </div>
          <div class="form-group">
            <label>City *</label>
            <input type="text" id="regCity" placeholder="Your City" required>
          </div>
        </div>

        <div class="form-group">
          <label>Email Address (Gmail / Email) *</label>
          <input type="email" id="regEmail" placeholder="name@gmail.com" required>
          <small style="color: gray; font-size: 0.78rem;">Ek Gmail/Email ID aur Mobile Number se sirf ek hi account ban sakta hai.</small>
        </div>

        <!-- Full Delivery Address Section -->
        <div class="form-group">
          <label>Full Address (House No, Street, Landmark) *</label>
          <textarea id="regAddress" rows="2" placeholder="e.g. Plot 42, Near Krishna Mandir, Malviya Nagar" required></textarea>
        </div>

        <!-- Password and Confirm Password Section -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label>Create Password *</label>
            <div style="position: relative; display: flex; align-items: center;">
              <input type="password" id="regPass" placeholder="At least 6 characters" required minlength="6" style="width: 100%; padding-right: 38px;">
              <button type="button" onclick="togglePasswordVisibility('regPass', this)" style="position: absolute; right: 8px; background: none; border: none; cursor: pointer; color: gray; font-size: 1.15rem; padding: 4px;" title="Show/Hide Password">
                👁️
              </button>
            </div>
          </div>
          <div class="form-group">
            <label>Confirm Password *</label>
            <div style="position: relative; display: flex; align-items: center;">
              <input type="password" id="regConfirmPass" placeholder="Re-enter password" required minlength="6" style="width: 100%; padding-right: 38px;">
              <button type="button" onclick="togglePasswordVisibility('regConfirmPass', this)" style="position: absolute; right: 8px; background: none; border: none; cursor: pointer; color: gray; font-size: 1.15rem; padding: 4px;" title="Show/Hide Password">
                👁️
              </button>
            </div>
          </div>
        </div>

        <button type="submit" id="regSubmitBtn" class="btn btn-red btn-block" style="padding: 13px; font-size: 1rem; margin-top: 10px;">
          Register Account →
        </button>
      </form>

      <div style="margin-top: 25px; text-align: center; font-size: 0.9rem; color: gray;">
        Already registered? 
        <a href="login.html" style="color: var(--primary-red); font-weight: 700;">Sign In Here</a>
      </div>
    </div>
  </div>

  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('regSubmitBtn');

      try {
        const name = document.getElementById('regName').value.trim();
        let phone = document.getElementById('regPhone').value.trim().replace(/[\s\-\+]/g, '');
        if (phone.startsWith('91') && phone.length === 12) {
          phone = phone.slice(2);
        }
        if (phone.startsWith('0') && phone.length === 11) {
          phone = phone.slice(1);
        }

        const city = document.getElementById('regCity').value.trim();
        const address = document.getElementById('regAddress').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPass').value;
        const confirmPass = document.getElementById('regConfirmPass').value;

        // Validation
        if (phone.length < 10) {
          showToast('Kripya valid 10-digit mobile number enter karein!', 'error');
          document.getElementById('regPhone').focus();
          return;
        }

        if (!email) {
          showToast('Kripya Gmail / Email ID enter karein!', 'error');
          document.getElementById('regEmail').focus();
          return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          showToast('Kripya valid Email ID (jaise example@gmail.com) enter karein!', 'error');
          document.getElementById('regEmail').focus();
          return;
        }

        if (password !== confirmPass) {
          showToast('Password aur Confirm Password match nahi kar rahe hain!', 'error');
          document.getElementById('regConfirmPass').focus();
          return;
        }

        if (password.length < 6) {
          showToast('Password kam se kam 6 characters ka hona chahiye!', 'error');
          document.getElementById('regPass').focus();
          return;
        }

        submitBtn.textContent = 'Checking & Creating Account...';
        submitBtn.disabled = true;

        const res = await registerCustomerWithDB({ name, phone, city, address, email, password, role: 'user' });
        if (res && res.success) {
          showToast(`Account successfully registered! Welcome, ${res.user.name || name}!`, 'success');
          setTimeout(() => {
            window.location.href = 'user/dashboard.html';
          }, 600);
        } else {
          showToast((res && res.message) || 'Registration failed. Please try again.', 'error');
          submitBtn.textContent = 'Register Account →';
          submitBtn.disabled = false;
        }
      } catch (err) {
        console.error('Registration exception:', err);
        showToast('Registration error: ' + (err.message || 'Please check details'), 'error');
        submitBtn.textContent = 'Register Account →';
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
