<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Radhey Radhey Furniture & Handicraft</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Google Firebase Cloud SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <style>
    .auth-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      background: white;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      padding: 35px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-light);
      border-top: 4px solid var(--primary-red);
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: gray;
    }
    .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      background: white;
      box-sizing: border-box;
    }
    .form-group input:focus {
      background: white;
      border-color: var(--primary-red);
      outline: none;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon">RR</div>
        <div class="logo-text">
          <h1>RADHEY <span>RADHEY</span></h1>
          <p>Furniture & Handicraft</p>
          <span class="logo-subtitle">(All Types of Glass, Aluminium &amp; Steel Work)</span>
        </div>
      </a>
      <a href="login.html" style="color: white; font-size: 0.88rem; margin-left: auto;">← Back to Login</a>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 25px;">
        <h2 style="font-family: var(--font-serif); font-size: 1.8rem; font-weight: 800; color: black;">Reset Password</h2>
        <p style="color: gray; font-size: 0.9rem;">Enter your registered Email or Mobile number and choose a new password.</p>
      </div>

      <form onsubmit="handleForgot(event)">
        <div class="form-group">
          <label>Registered Mobile or Email *</label>
          <input type="text" id="forgotTarget" placeholder="e.g. 9876543210 or customer@email.com" required>
        </div>

        <div class="form-group">
          <label>New Password *</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="newPass" placeholder="Minimum 6 characters" required minlength="6" style="width: 100%; padding-right: 42px;">
            <button type="button" onclick="togglePasswordVisibility('newPass', this)" style="position: absolute; right: 8px; background: none; border: none; cursor: pointer; color: gray; font-size: 1.15rem; padding: 4px;" title="Show/Hide Password">👁️</button>
          </div>
        </div>

        <div class="form-group">
          <label>Confirm New Password *</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="confirmPass" placeholder="Re-enter new password" required minlength="6" style="width: 100%; padding-right: 42px;">
            <button type="button" onclick="togglePasswordVisibility('confirmPass', this)" style="position: absolute; right: 8px; background: none; border: none; cursor: pointer; color: gray; font-size: 1.15rem; padding: 4px;" title="Show/Hide Password">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-red btn-block" style="padding: 13px; font-size: 1rem; margin-top: 10px;">
          Set New Password →
        </button>
      </form>

      <div style="margin-top: 25px; text-align: center; font-size: 0.9rem; color: gray;">
        Remembered password? 
        <a href="login.html" style="color: var(--primary-red); font-weight: 700;">Sign In</a>
      </div>
    </div>
  </div>

  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    async function handleForgot(e) {
      e.preventDefault();
      const target = document.getElementById('forgotTarget').value.trim();
      const newP = document.getElementById('newPass').value;
      const confP = document.getElementById('confirmPass').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');

      if (newP !== confP) {
        showToast('Passwords do not match! Please check and try again.', 'error');
        return;
      }

      submitBtn.textContent = 'Updating Password...';
      submitBtn.disabled = true;

      const res = await resetCustomerPasswordInDB(target, newP);
      if (res && res.success) {
        showToast('Password successfully reset! Please sign in with your new password.', 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);
      } else {
        showToast(res && res.message ? res.message : 'User with this mobile/email not found! Please check or register.', 'error');
        submitBtn.textContent = 'Set New Password →';
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
