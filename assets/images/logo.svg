<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="red"/>
      <stop offset="100%" stop-color="darkred"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="red" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Emblem Badge -->
  <rect x="10" y="15" width="90" height="90" rx="18" fill="url(#redGrad)" filter="url(#glow)"/>
  <rect x="14" y="19" width="82" height="82" rx="14" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Monogram RR -->
  <text x="55" y="74" font-family="'Playfair Display', serif" font-size="46" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-1">RR</text>
  
  <text x="120" y="62" font-family="'Playfair Display', serif" font-size="34" font-weight="800" fill="white" letter-spacing="1.5">
    RADHEY <tspan fill="red">RADHEY</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="122" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="gray" letter-spacing="4">
    FURNITURE &amp; HANDICRAFT
  </text>
  
  <!-- Decorative Heritage Underline -->
  <line x1="120" y1="98" x2="480" y2="98" stroke="red" stroke-width="2" stroke-linecap="round"/>
</svg>
